name = "kolmarket-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"

# Custom domain routes
routes = [
  { pattern = "api.kolmarket.ai", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "socialbet-db"
database_id = "acf5ab8f-ea91-429c-bcd2-bf7899f91acc"

# Cloudflare AI Workers binding
[ai]
binding = "AI"
